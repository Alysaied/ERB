@if (rows.length) {
  <div class="data-table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
        @for (col of displayColumns; track col) {
          <th>{{ col }}</th>
        }
        </tr>
      </thead>
      <tbody>
      @for (row of rows; track $index) {
        <tr>
        @for (col of displayColumns; track col) {
          <td>{{ row[col] }}</td>
        }
        </tr>
      }
      </tbody>
    </table>
  </div>
} @else {
  <p class="empty-table">No records to display</p>
}
