spring:
  application:
    name: ims-backend
  datasource:
    url: jdbc:postgresql://${IMS_DB_HOST:localhost}:${IMS_DB_PORT:5436}/${IMS_DB_NAME:ims}
    username: ${IMS_DB_USER:postgres}
    password: ${IMS_DB_PASSWORD:hggi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: public,identity
    default-schema: public
    create-schemas: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

info:
  app:
    version: 0.1.0-SNAPSHOT

ims:
  security:
    jwt:
      secret: "ims-dev-jwt-secret-change-me-32chars-min"
      ttl-minutes: 480
    cors:
      allowed-origins: http://localhost:4200

logging:
  level:
    org.springframework.security: INFO
    com.ims: INFO
